[package]
name = "coding-lab"
description = "Claude Code 多 session 專案追蹤 collector"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# 二進位拆分（PLAN「網路綁定、部署形態、二進位拆分」）：發佈出 core（預設）與 full 兩種。
# hub、tls、notify、summary 還沒做；做出來時各自是一個 feature，掛進 full。
[features]
default = ["collector"]
collector = []
full = ["collector"]

[package.metadata.dist]
# 前端不內嵌：web/ 跟二進位放進同一個壓縮檔，collector 預設用二進位旁邊的 web/（config::bundled_web）
include = ["../../web"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
clap = { version = "4.6.7", features = ["derive"] }
# 金鑰（#666）：secret 只存 SHA-256、金鑰與 server secret 要密碼學等級的亂數
getrandom = "0.3.4"
# hub（#663）對上游 collector 開 WebSocket client；兩個都已在 lock 裡（先前只是 dev-dependency），不帶 TLS
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
notify = "8.2.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# Windows 子程序（schtasks）的輸出是 OEM code page（cp950 等），要解成可讀文字（#724）
encoding_rs = "0.8.42"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.8"

[dev-dependencies]

